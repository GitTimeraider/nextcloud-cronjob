name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout Source Code
        uses: actions/checkout@v7
      -
        name: Docker QEmu Setup
        uses: docker/setup-qemu-action@v4
      -
        name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v4
      -
        name: Set lowercase repository owner
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      -
        name: Determine publish target and tags
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            target="master"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            target="develop"
          else
            target=""
          fi

          image="ghcr.io/${{ steps.repo_owner.outputs.owner }}/nextcloud-cronjob"

          case "$target" in
            master)
              tags="$image:latest,$image:master"
              push="true"
              ;;
            develop)
              tags="$image:develop"
              push="true"
              ;;
            *)
              # Keep PR builds as build-only checks.
              tags="$image:test"
              push="false"
              ;;
          esac

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: steps.publish.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Docker Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.publish.outputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.publish.outputs.tags }}
